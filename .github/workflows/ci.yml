name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: cargo check (${{ matrix.os }})
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libwayland-dev libdbus-1-dev libasound2-dev
      - if: runner.os == 'Linux'
        run: cargo check --features "backend-wgpu,backend-tiny-skia,backend-tiny-skia-x11,backend-tiny-skia-wayland,lyon,display,display-advanced,text-cosmic,i18n,a11y-platform,file-dialog,clipboard,system-theme,global-hotkey,tracing,devtools,file-logging,ext-jiff,ext-image,ext-svg,ext-audio,ssr,async-tokio"
      - if: runner.os != 'Linux'
        run: cargo check --features "backend-wgpu,backend-tiny-skia,backend-tiny-skia-x11,backend-tiny-skia-wayland,lyon,display,display-advanced,text-cosmic,i18n,tray,a11y-platform,file-dialog,clipboard,system-theme,global-hotkey,tracing,devtools,file-logging,ext-jiff,ext-image,ext-svg,ext-audio,ssr,async-tokio"

  clippy:
    name: cargo clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libwayland-dev libdbus-1-dev libasound2-dev
      - run: cargo clippy --lib --features "backend-wgpu,backend-tiny-skia,backend-tiny-skia-x11,backend-tiny-skia-wayland,lyon,display,display-advanced,text-cosmic,i18n,a11y-platform,file-dialog,clipboard,system-theme,global-hotkey,tracing,devtools,file-logging,ext-jiff,ext-image,ext-svg,ext-audio,ssr,async-tokio" -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libwayland-dev libdbus-1-dev libasound2-dev
      - if: runner.os == 'Linux'
        run: cargo test --lib --features "backend-wgpu,backend-tiny-skia,backend-tiny-skia-x11,backend-tiny-skia-wayland,lyon,display,display-advanced,text-cosmic,i18n,a11y-platform,file-dialog,clipboard,system-theme,global-hotkey,tracing,devtools,file-logging,ext-jiff,ext-image,ext-svg,ext-audio,ssr,async-tokio"
      - if: runner.os != 'Linux'
        run: cargo test --lib --features "backend-wgpu,backend-tiny-skia,backend-tiny-skia-x11,backend-tiny-skia-wayland,lyon,display,display-advanced,text-cosmic,i18n,tray,a11y-platform,file-dialog,clipboard,system-theme,global-hotkey,tracing,devtools,file-logging,ext-jiff,ext-image,ext-svg,ext-audio,ssr,async-tokio"

  test-integration:
    name: cargo test (integration)
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libwayland-dev libdbus-1-dev libasound2-dev
      - if: runner.os == 'Linux'
        run: cargo test --tests --features "backend-wgpu,backend-tiny-skia,backend-tiny-skia-x11,backend-tiny-skia-wayland,lyon,display,display-advanced,text-cosmic,i18n,a11y-platform,file-dialog,clipboard,system-theme,global-hotkey,tracing,devtools,file-logging,ext-jiff,ext-image,ext-svg,ext-audio,ssr,async-tokio"
      - if: runner.os != 'Linux'
        run: cargo test --tests --features "backend-wgpu,backend-tiny-skia,backend-tiny-skia-x11,backend-tiny-skia-wayland,lyon,display,display-advanced,text-cosmic,i18n,tray,a11y-platform,file-dialog,clipboard,system-theme,global-hotkey,tracing,devtools,file-logging,ext-jiff,ext-image,ext-svg,ext-audio,ssr,async-tokio"
